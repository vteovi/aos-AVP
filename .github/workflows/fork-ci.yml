# Fork 专用云端构建：repo 拉取上游 v6_4 全套源码后，应用 ci-patches 里的本地定制补丁，再编译 APK。
# 与上游自带的 nova.yml 不同：本 workflow 会把本 fork 的定制改动（显示隐藏文件夹、SMB 超时）编进 APK。
name: NOVA Fork CI

on:
  push:
    branches: [ nova ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_HOME:   ${ANDROID_HOME}
      ANDROID_SDK:        ${ANDROID_HOME}
      ANDROID_NDK_HOME:   ${ANDROID_NDK_LATEST_HOME}
      ANDROID_NDK:        ${ANDROID_NDK_LATEST_HOME}
    steps:
      - name: Checkout fork main repo (carries ci-patches)
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Linux build packages
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y ninja-build maven build-essential wget curl unzip git pkg-config \
            python3 python3-pip python3-setuptools python3-wheel

      - name: Install recent nasm for dav1d
        run: |
          wget http://ftp.debian.org/debian/pool/main/n/nasm/nasm_2.15.05-1_amd64.deb
          sudo dpkg -i ./nasm_2.15.05-1_amd64.deb
          nasm --version

      - name: Install compatible meson
        run: |
          sudo pip3 install meson==0.53.2
          meson --version

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Retrieve full upstream nova source (v6_4 manifest)
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m v6_4.xml
          repo sync -j 4
          repo forall -c 'git checkout -t $REPO_REMOTE/$REPO_RREV'

      - name: Pin patched modules to local baseline and apply customization patches
        run: |
          set -e
          # FileCoreLibrary baseline
          cd nova/FileCoreLibrary
          git checkout 56fc8df
          git apply "$GITHUB_WORKSPACE/ci-patches/FileCoreLibrary.patch"
          # MediaLib baseline
          cd ../MediaLib
          git checkout fba68119
          git apply "$GITHUB_WORKSPACE/ci-patches/MediaLib.patch"
          # Video baseline
          cd ../Video
          git checkout 4bf05901
          git apply "$GITHUB_WORKSPACE/ci-patches/Video.patch"

      - name: Generate self-signed keystore and signing config
        run: |
          set -e
          cd nova/Video
          keytool -genkeypair -v \
            -keystore nova-release.keystore \
            -alias nova-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nova123456 -keypass nova123456 \
            -dname "CN=nova-fork, OU=dev, O=vteovi, L=CN, ST=CN, C=CN"
          cat > keystore.properties <<'EOF'
          storeFile=nova-release.keystore
          storePassword=nova123456
          keyAlias=nova-release
          keyPassword=nova123456
          EOF

      - name: Build universal noamazon release APK
        run: |
          cd nova/Video
          ./gradlew -Puniversal assembleNoamazonRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-custom-apk
          path: nova/Video/build/outputs/apk/**/*.apk
          retention-days: 14
